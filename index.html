<style>
/* Concepto: guía de curso de una sola página con navegación por semanas. Paleta BIU (azul marino y turquesa), titulares en serif, datos en mono. */
:root {
  --bg: #f3f6fb; --surface: #ffffff; --surface-2: #f8fafc; --ink: #0f172a; --muted: #475569; --line: #dfe5ef;
  --navy: #041448; --navy-2: #0a1f5e; --accent: #0d8f76; --accent-soft: #e3f7f2; --accent-bright: #1bdab5;
  --gold: #b9811f; --gold-soft: #fbf1dc; --blue-soft: #e8edf8; --warn: #b45309; --ok: #0f9d6e;
  --head-ink: #f4f7ff; --head-muted: #b9c6e8;
  --serif: "Fraunces", Georgia, "Times New Roman", serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a1020; --surface: #121a31; --surface-2: #0f1730; --ink: #e8edf8; --muted: #a3b0cc; --line: #26325a;
  --accent: #1bdab5; --accent-soft: #0f2d33; --gold: #e0ac55; --gold-soft: #2a2414; --blue-soft: #15204a; --warn: #f0a94a; --ok: #3ddba5; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a1020; --surface: #121a31; --surface-2: #0f1730; --ink: #e8edf8; --muted: #a3b0cc; --line: #26325a;
  --accent: #1bdab5; --accent-soft: #0f2d33; --gold: #e0ac55; --gold-soft: #2a2414; --blue-soft: #15204a; --warn: #f0a94a; --ok: #3ddba5; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; display: grid; gap: 20px; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(1.8rem, 4.4vw, 2.7rem); }
h2 { font-size: 1.45rem; } h3 { font-size: 1.1rem; }
p { margin: 0; }
.mono { font-family: var(--mono); }
.eyebrow { font-family: var(--mono); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }

/* cabecera */
.top { background: linear-gradient(120deg, var(--navy), var(--navy-2)); color: var(--head-ink); border-radius: 14px; padding: 18px 22px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; }
.top .brand small { font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; color: var(--accent-bright); display: block; }
.top .brand strong { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; color: var(--head-ink); }
.top nav { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.top nav button { background: none; border: 0; padding: 6px 2px; color: var(--head-muted); font-weight: 500; border-bottom: 2px solid transparent; }
.top nav button[aria-current="page"] { color: #fff; border-color: var(--accent-bright); }
.top .meta { font-family: var(--mono); font-size: .75rem; color: var(--head-muted); letter-spacing: .06em; display: flex; gap: 12px; align-items: center; }
.theme-btn { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: var(--head-ink); border-radius: 999px; padding: 3px 12px; font-size: .75rem; }

/* barra de semanas */
.steps { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; overflow-x: auto; }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, minmax(86px, 1fr)); gap: 4px; min-width: 900px; }
.steps button { width: 100%; background: none; border: 0; padding: 4px 6px; display: grid; justify-items: center; gap: 6px; text-align: center; font-size: .7rem; line-height: 1.25; color: var(--muted); }
.steps .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: .75rem; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.steps .done .dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.steps .now .dot { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
.steps .now { color: var(--ink); font-weight: 600; }
.steps li.eval .dot { border-color: var(--accent); }

/* bloques */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; min-width: 0; }
.lead { color: var(--muted); max-width: 66ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px; font-size: .82rem; font-weight: 500; }
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.gold { background: var(--gold-soft); border-color: transparent; color: var(--gold); }
.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 14px 18px; border-radius: 0 10px 10px 0; }
.callout b { font-weight: 600; }
.hero { display: grid; gap: 16px; padding-block: 12px 4px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.sec-title { display: grid; gap: 4px; margin-bottom: 14px; }

/* cadena de evaluación */
.chain { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); }
.chain button { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.chain button:hover { border-color: var(--accent); }
.chain .n { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.chain .t { font-weight: 600; font-size: .9rem; line-height: 1.3; }
.chain .p { font-family: var(--mono); font-size: .85rem; color: var(--accent); }
.chain .p.f { color: var(--muted); }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* semana */
.crumbs { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); }
.week-head { display: grid; gap: 14px; padding-block: 8px; }
.slo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.slo li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.slo li:last-child { border: 0; }
.slo code { font-family: var(--mono); font-size: .78rem; color: var(--accent); white-space: nowrap; }
.act { display: grid; gap: 12px; }
.act header { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: start; }
.badge { font-family: var(--mono); font-size: .78rem; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.badge.f { background: var(--blue-soft); color: var(--muted); }
.act ul, .read ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.check { list-style: none; padding: 0 !important; display: grid; gap: 8px; }
.check label { display: flex; gap: 10px; align-items: start; cursor: pointer; }
.check input { margin-top: 5px; width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.read h3 { margin-bottom: 8px; font-size: 1rem; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-align: left; display: grid; gap: 2px; min-width: 0; }
.pager button:hover { border-color: var(--accent); }
.pager small { font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; color: var(--accent); }
.pager button:last-child { text-align: right; }
.pager .ph { visibility: hidden; }
.warnbox { border-left: 3px solid var(--gold); background: var(--gold-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: .92rem; }

/* recursos */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; vertical-align: top; }
th { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 600; border-bottom: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs a { text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: .85rem; color: var(--ink); }
.tabs a:hover { border-color: var(--accent); }
details.rub { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.rub summary { padding: 14px 18px; cursor: pointer; font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; list-style: none; }
details.rub summary::-webkit-details-marker { display: none; }
details.rub[open] summary { border-bottom: 1px solid var(--line); }
details.rub .body { padding: 14px 18px 18px; display: grid; gap: 12px; }
.rub table { min-width: 760px; }
.rub td:first-child { min-width: 180px; }
.rub td small { display: block; font-family: var(--mono); color: var(--accent); }
.calc { display: grid; gap: 16px; }
.calc .rows { display: grid; gap: 8px; }
.calc .row { display: grid; grid-template-columns: 1fr 70px 110px; gap: 10px; align-items: center; }
.calc .row label { font-size: .9rem; }
.calc input[type="number"] { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; }
.calc .w { font-family: var(--mono); font-size: .8rem; color: var(--muted); text-align: right; }
.result { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.result div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.result small { font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; }
.result b { font-family: var(--serif); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.copy { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; font-size: .78rem; }
.foot { font-size: .8rem; color: var(--muted); }
@media (max-width: 560px) { .calc .row { grid-template-columns: 1fr 64px; } .calc .row .w { display: none; } .card { padding: 16px; } }
@media (prefers-reduced-motion: no-preference) { .view { animation: in .25s ease both; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }

cs","title":"Fundamentos de Machine Learning, Deep Learning y Learning Analytics en educación","desc":"Machine Learning, Deep Learning y Learning Analytics en educación: qué pueden y qué no pueden hacer. Terminas con el diagnóstico de una necesidad educativa real.","pregunta":"¿Cómo pueden el Machine Learning, el Deep Learning y Learning Analytics contribuir a comprender problemas educativos y apoyar decisiones basadas en evidencia sin sustituir el juicio profesional humano?","clo":"CLO1, CLO3 · AICLO1, AICLO4","slo":["SLO 2.1 Diferenciar IA, ML, DL y Learning Analytics.","SLO 2.2 Analizar el aprendizaje supervisado, no supervisado y por refuerzo y su aplicación educativa.","SLO 2.3 Evaluar oportunidades y limitaciones de ML y Learning Analytics.","SLO 2.4 Interpretar datos y evidencia educativa para identificar problemas susceptibles de análisis con IA.","SLO 2.5 Examinar equidad, privacidad, sesgo y responsabilidad humana en el uso de datos educativos."],"activities":[{"name":"Diagnóstico de una necesidad educativa y oportunidad de aplicación de IA","tipo":"Sumativa","pesoN":10,"rid":"R2","items":["Ocho apartados: contexto educativo; problema o necesidad; datos disponibles o necesarios; posible aplicación de IA (predicción, clasificación, patrones, personalización, alerta temprana, recomendación, apoyo a decisiones); valor educativo esperado; limitaciones y riesgos iniciales; rol de la supervisión humana; pregunta orientadora."]}],"lect":{"req":["Russell, S. J., & Norvig, P. (2021). Artificial Intelligence: A Modern Approach (4th ed.). Pearson."],"comp":["Chollet, F. (2017). Deep Learning with Python. Manning.","UNESCO (2023). Inteligencia artificial y educación: guía para las personas a cargo de formular políticas.","Siemens, G. (2013). Learning Analytics: The Emergence of a Discipline.","Baker, R. S., & Inventado, P. S. (2014). Educational Data Mining and Learning Analytics."]}},{"n":3,"short":"Datos y enmarcado del problema","title":"Datos educativos, evidencia y enmarcado de problemas para la integración de IA","desc":"Cómo se mira un dato educativo antes de decidir. Exploras datos con Orange y enmarcas un problema que la IA podría apoyar. Es una actividad formativa sin nota.","pregunta":"¿Cómo puede el análisis responsable de datos educativos ayudar a definir con mayor precisión un problema y determinar si la inteligencia artificial constituye una respuesta pertinente?","clo":"CLO1, CLO4 · AICLO1, AICLO4","slo":["SLO 3.1 Identificar fuentes y tipos de datos relevantes para el análisis de problemas educativos.","SLO 3.2 Interpretar visualizaciones, patrones y tendencias.","SLO 3.3 Aplicar procesos básicos de preparación y exploración de datos con una herramienta visual como Orange.","SLO 3.4 Analizar calidad, suficiencia y limitaciones de los datos.","SLO 3.5 Refinar el enmarcado de un problema distinguiendo necesidad, datos y posible intervención."],"activities":[{"name":"Laboratorio de exploración de datos educativos con Orange y matriz de enmarcado del problema","tipo":"Formativa","pesoN":0,"rid":null,"items":["Siete pasos en Orange: importar, explorar variables, identificar valores faltantes, revisar atípicos, generar dos visualizaciones como mínimo, identificar patrones, interpretar en clave educativa.","Matriz de enmarcado con ocho elementos: necesidad educativa, evidencia disponible, datos relevantes, patrón observado, limitaciones de los datos, posible aplicación de IA, riesgo de interpretación incorrecta, decisión humana requerida."]}],"lect":{"req":["Russell, S. J., & Norvig, P. (2021). Artificial Intelligence: A Modern Approach (4th ed.). Pearson."],"comp":["Orange Data Mining. Documentación y recursos introductorios.","Google. Machine Learning Problem Framing.","Google. Rules of Machine Learning."]}},{"n":4,"short":"Comparar soluciones de IA","title":"Evaluación de aplicaciones de IA para la enseñanza, el aprendizaje y la evaluación","desc":"Comparas tres alternativas de IA para enseñar, aprender o evaluar con una matriz de once criterios y decides con evidencia, incluida la condición en que no recomendarías implementar.","pregunta":"¿Cómo puede determinarse si una aplicación de inteligencia artificial aporta verdadero valor pedagógico y responde de manera responsable a una necesidad educativa concreta?","clo":"CLO2, CLO3 · AICLO1, AICLO2, AICLO4","slo":["SLO 4.1 Analizar aplicaciones de IA usadas en enseñanza, aprendizaje y evaluación.","SLO 4.2 Comparar alternativas con criterios pedagógicos, tecnológicos, éticos, de accesibilidad y sustentabilidad.","SLO 4.3 Evaluar la pertinencia de una aplicación frente a una necesidad y a la evidencia.","SLO 4.4 Analizar riesgos de sesgo, confiabilidad, inequidad, privacidad y dependencia tecnológica.","SLO 4.5 Justificar la selección o rechazo de una solución con evidencia académica y criterios centrados en el ser humano."],"activities":[{"name":"Evaluación comparativa de alternativas de IA y decisión pedagógica basada en evidencia","tipo":"Sumativa","pesoN":15,"rid":"R3","items":["Tres alternativas (por ejemplo: Learning Analytics, asistentes, chatbots, herramientas predictivas, plataformas adaptativas, retroalimentación automatizada, IA generativa).","Matriz de 11 criterios: pertinencia pedagógica, evidencia de efectividad, accesibilidad, inclusión y equidad, privacidad y datos, confiabilidad, transparencia, riesgo de sesgo, sustentabilidad, viabilidad institucional, necesidad de supervisión humana.","Análisis final de siete puntos, incluida la condición en que no se recomendaría implementar."]}],"lect":{"req":["Estructura de la semana y cronograma.","Russell, S. J., & Norvig, P. (2021). Artificial Intelligence: A Modern Approach (4th ed.). Pearson."],"comp":["UNESCO (2021). Recomendación sobre la ética de la inteligencia artificial.","OECD (2023). OECD Digital Education Outlook 2023.","Contreras Bravo, L. E., Fuentes López, H. J., & Rivas Trujillo, E. (2023). Análisis del rendimiento académico mediante técnicas de aprendizaje automático con métodos de ensamble."]}},{"n":5,"short":"Certificación SUJIS","title":"Certificación profesional complementaria en analítica de aprendizaje inteligente (SUJIS)","desc":"Certificación complementaria en analítica de aprendizaje inteligente. La evidencia es el certificado emitido por SUJIS.","pregunta":"¿Cómo puede la analítica de aprendizaje apoyada por inteligencia artificial contribuir a decisiones educativas más informadas, responsables y centradas en el estudiante?","clo":"CLO2, CLO3 · AICLO3, AICLO5","slo":["SLO 5.1 Analizar el papel de Learning Analytics y la IA en la comprensión de procesos educativos.","SLO 5.2 Interpretar aplicaciones de analítica educativa para identificar patrones, necesidades y oportunidades de intervención.","SLO 5.3 Evaluar privacidad, equidad, transparencia y uso responsable de datos educativos.","SLO 5.4 Relacionar lo aprendido con problemas y decisiones de contextos reales.","SLO 5.5 Demostrar competencias profesionales con la culminación satisfactoria de la certificación."],"activities":[{"name":"Certificación profesional SUJIS","tipo":"Sumativa","pesoN":10,"rid":"R4","items":["Completar satisfactoriamente los módulos, actividades y requisitos de la certificación. La evidencia es el certificado emitido."]}],"lect":{"req":["El Syllabus no lista lecturas para esta semana."],"comp":[]}},{"n":6,"short":"IA generativa y prompts","title":"IA generativa, LLMs e ingeniería de prompts en educación","desc":"IA generativa, modelos de lenguaje e ingeniería de prompts. Evalúas críticamente una aplicación y llevas el registro de tus prompts. Actividad formativa sin nota.","pregunta":"¿Cómo pueden la inteligencia artificial generativa y los grandes modelos de lenguaje integrarse en educación de manera pedagógicamente pertinente, crítica, responsable y centrada en el ser humano?","clo":"CLO1, CLO2, CLO3 · AICLO1, AICLO2, AICLO5","slo":["SLO 6.1 Explicar fundamentos de NLP, LLMs e IA generativa y su relación con aplicaciones educativas.","SLO 6.2 Analizar aplicaciones de IA generativa en enseñanza, aprendizaje, evaluación, diseño instruccional y apoyo estudiantil.","SLO 6.3 Diseñar prompts claros, contextualizados y orientados a propósitos educativos.","SLO 6.4 Evaluar críticamente respuestas generadas por factualidad, pertinencia, sesgo, privacidad, seguridad y confiabilidad.","SLO 6.5 Formular criterios para el uso responsable de LLMs en educación."],"activities":[{"name":"Evaluación crítica de una aplicación de IA generativa en educación, con registro de prompts","tipo":"Formativa","pesoN":0,"rid":null,"items":["Ocho pasos: propósito educativo, prompt inicial, refinamiento, al menos dos iteraciones documentadas, evaluación con nueve criterios, tipo de uso apropiado, situaciones en que no se recomienda, tres criterios institucionales."]}],"lect":{"req":["Estructura de la semana y cronograma.","Russell, S. J., & Norvig, P. (2021). Artificial Intelligence: A Modern Approach (4th ed.). Pearson."],"comp":["UNESCO (2023). Guidance for Generative AI in Education and Research.","Brousseau, C., & Shar, M. (2024). LLMs in Production. Manning.","Alammar, J. (2023). The Illustrated Transformer."]}},{"n":7,"short":"Personalización e inclusión","title":"IA para personalización, accesibilidad, inclusión y apoyo al estudiante","desc":"IA para personalizar, hacer accesible e incluir. Evalúas una solución concreta de apoyo al estudiante con criterios de equidad y supervisión humana.","pregunta":"¿Cómo puede la inteligencia artificial ampliar las oportunidades de aprendizaje sin profundizar desigualdades, excluir estudiantes ni debilitar la autonomía y la supervisión humana?","clo":"CLO2, CLO3, CLO4 · AICLO2, AICLO3, AICLO5","slo":["SLO 7.1 Analizar aplicaciones de IA para personalización, apoyo académico, accesibilidad e inclusión.","SLO 7.2 Evaluar la alineación entre la solución, las características de los estudiantes y las necesidades del contexto.","SLO 7.3 Examinar riesgos de sesgo, exclusión, inequidad y sobreautomatización.","SLO 7.4 Diseñar criterios para seleccionar o adaptar una solución desde una perspectiva centrada en el ser humano.","SLO 7.5 Formular recomendaciones que preserven la agencia del estudiante, la responsabilidad docente y la supervisión humana."],"activities":[{"name":"Evaluación de una solución de IA para personalización, accesibilidad o inclusión","tipo":"Sumativa","pesoN":15,"rid":"R5","items":["Informe de once apartados: necesidad que atiende, población beneficiaria, funcionalidades, valor pedagógico, nivel de accesibilidad, contribución a la inclusión, riesgos de sesgo o exclusión, efectos sobre la autonomía del estudiante, rol del docente y supervisión humana, viabilidad y sustentabilidad, recomendación final."]}],"lect":{"req":["Estructura de la semana y cronograma.","Russell, S. J., & Norvig, P. (2021). Artificial Intelligence: A Modern Approach (4th ed.). Pearson."],"comp":["UNESCO IESALC (2023). Guía para docentes sobre IA generativa.","UNESCO (2023). Guidance for Generative AI in Education and Research.","Luckin, R. (2018). Machine Learning and Human Intelligence. UCL Press."]}},{"n":8,"short":"IA multimodal y emocional","title":"IA multimodal, IA emocional y Affective Computing en educación","desc":"IA multimodal, reconocimiento emocional y Affective Computing. Analizas una aplicación con atención a accesibilidad, inclusión y pertinencia. Actividad formativa sin nota.","pregunta":"¿Cómo pueden los sistemas de IA multimodal y de reconocimiento emocional aportar valor educativo sin comprometer la privacidad, la dignidad, la autonomía ni el bienestar de los estudiantes?","clo":"CLO1, CLO2, CLO3 · AICLO1, AICLO2, AICLO5","slo":["SLO 8.1 Analizar fundamentos y aplicaciones educativas de la IA multimodal y del Affective Computing.","SLO 8.2 Evaluar el potencial de sistemas que integran texto, voz, imagen, video y otras señales.","SLO 8.3 Examinar la precisión, validez y limitaciones del reconocimiento emocional.","SLO 8.4 Analizar implicaciones éticas: privacidad, consentimiento, sesgo, vigilancia y datos emocionales.","SLO 8.5 Formular criterios para decidir cuándo una aplicación es educativa, ética y humanamente justificable."],"activities":[{"name":"Análisis crítico de una aplicación de IA multimodal o emocional","tipo":"Formativa","pesoN":0,"rid":null,"items":["Matriz de 12 dimensiones: propósito educativo, usuarios, datos recopilados, modalidades, beneficio esperado, precisión o confiabilidad, posible sesgo, privacidad, consentimiento, riesgo de vigilancia o sobreinterpretación, supervisión humana, recomendación final.","Respuesta breve a la pregunta sobre los límites de la interpretación de emociones."]}],"lect":{"req":["Estructura de la semana y cronograma.","Russell, S. J., & Norvig, P. (2021). Artificial Intelligence: A Modern Approach (4th ed.). Pearson."],"comp":["Grafsgaard, J. F., Wiggins, J. B., Boyer, K. E., Wiebe, E. N., & Lester, J. C. (2014). Multimodal affect recognition in learning environments.","Zhang, X., Wang, Y., & Li, H. (2025). Affective computing in online higher education: A systematic review.","Schmidhuber, J. (2015). Deep Learning in Neural Networks: An Overview."]}},{"n":9,"short":"Ética y gobernanza","title":"Gobernanza, ética y sustentabilidad en inteligencia artificial","desc":"Ética, riesgos, gobernanza y sustentabilidad. Redactas el marco preliminar de gobernanza para integrar IA de forma responsable en una institución educativa.","pregunta":"¿Cómo puede una institución educativa gobernar el uso de la inteligencia artificial de manera ética, responsable, transparente y sustentable, preservando la supervisión humana y protegiendo los derechos de sus comunidades?","clo":"CLO2, CLO3, CLO4 · AICLO3, AICLO4, AICLO5","slo":["SLO 9.1 Analizar principios éticos y marcos de gobernanza aplicables al uso de IA en instituciones educativas.","SLO 9.2 Evaluar riesgos de privacidad, seguridad, equidad, inclusión, transparencia y confiabilidad.","SLO 9.3 Examinar responsabilidades institucionales y humanas en la selección, implementación, supervisión y evaluación de la IA.","SLO 9.4 Diseñar estrategias de mitigación y mecanismos de supervisión.","SLO 9.5 Formular lineamientos institucionales para una integración ética, responsable y sustentable, basada en evidencia."],"activities":[{"name":"Marco preliminar de gobernanza e integración responsable de IA en una institución educativa","tipo":"Sumativa","pesoN":15,"rid":"R6","items":["Documento de once componentes: contexto y necesidad; solución de IA; principios de gobernanza; mapa de riesgos; gobernanza de datos; supervisión humana; roles y responsabilidades; criterios de implementación; indicadores de seguimiento; actualización continua; justificación con evidencia académica y marcos profesionales."]}],"lect":{"req":["Estructura de la semana y cronograma.","Russell, S. J., & Norvig, P. (2021). Artificial Intelligence: A Modern Approach (4th ed.). Pearson."],"comp":["UNESCO (2021). Recomendación sobre la ética de la inteligencia artificial.","UNESCO (2023). Inteligencia artificial y educación: guía para las personas a cargo de formular políticas.","OECD (2023). Recursos y marcos sobre gobernanza de inteligencia artificial.","EY (2023). El entorno regulatorio global de la inteligencia artificial: tendencias y consideraciones normativas."]}},{"n":10,"short":"Propuesta y defensa","title":"Integración sustentable de IA: propuesta final y defensa académica","desc":"Integras todo el recorrido en el proyecto final escrito y lo defiendes en una presentación de 10 a 12 minutos.","pregunta":"¿Cómo puede un líder educativo justificar y defender una propuesta de integración de inteligencia artificial que sea pedagógicamente pertinente, ética, inclusiva, sustentable y viable a nivel institucional?","clo":"CLO1 a CLO4 · AICLO1 a AICLO5","slo":["SLO 10.1 Integrar fundamentos conceptuales, pedagógicos, tecnológicos, éticos y de sustentabilidad en una propuesta coherente.","SLO 10.2 Justificar la selección de una solución con evidencia académica, datos educativos y criterios de pertinencia contextual.","SLO 10.3 Diseñar estrategias de implementación con accesibilidad, inclusión, gobernanza de datos, gestión de riesgos y supervisión humana.","SLO 10.4 Establecer indicadores y mecanismos para evaluar el impacto educativo, institucional y sustentable.","SLO 10.5 Comunicar y defender académicamente la propuesta, respondiendo a preguntas y objeciones."],"activities":[{"name":"Proyecto final integrador (documento)","tipo":"Sumativa","pesoN":20,"rid":"R7","items":["Documento de doce secciones, descrito en el mensaje."]},{"name":"Presentación y defensa académica","tipo":"Sumativa","pesoN":10,"rid":"R8","items":["Presentación de 10 a 12 minutos con preguntas del profesor o de compañeros."]}],"lect":{"req":["El Syllabus no lista lecturas para esta semana."],"comp":[]}}],"descripcion":["Análisis avanzado de los fundamentos, la evolución y las aplicaciones emergentes de la inteligencia artificial en educación, con énfasis en una transformación educativa sustentable, inclusiva y centrada en el ser humano.","Desde la perspectiva del scholar-practitioner examinas investigación empírica y prácticas emergentes para valorar el aporte educativo de la IA, sus implicaciones éticas, su accesibilidad, equidad y sustentabilidad, y los riesgos de adoptarla."],"clos":[["CLO1","Analizar críticamente los conceptos fundamentales, perspectivas teóricas y desarrollos emergentes de la inteligencia artificial y sus implicaciones para la educación virtual y mediada por tecnología."],["CLO2","Evaluar aplicaciones de inteligencia artificial en educación considerando su valor pedagógico, sustentabilidad, accesibilidad, equidad, implicaciones éticas y potencial impacto sobre los resultados de aprendizaje y la efectividad institucional."],["CLO3","Analizar oportunidades, limitaciones, riesgos y consideraciones centradas en el ser humano asociadas con la adopción responsable de inteligencia artificial en diversos contextos educativos."],["CLO4","Formular recomendaciones fundamentadas en investigación para la integración responsable y sustentable de inteligencia artificial orientada a atender desafíos educativos significativos."]],"plan":[[1,"Foro de discusión","Sumativa",5],[2,"Diagnóstico de una necesidad educativa","Sumativa",10],[3,"Laboratorio Orange y enmarcado del problema","Formativa",0],[4,"Comparación de tres alternativas de IA","Sumativa",15],[5,"Certificación SUJIS","Sumativa",10],[6,"Evaluación crítica de IA generativa","Formativa",0],[7,"Solución de personalización, accesibilidad o inclusión","Sumativa",15],[8,"Análisis de IA multimodal o emocional","Formativa",0],[9,"Marco preliminar de gobernanza","Sumativa",15],[10,"Proyecto final escrito","Sumativa",20],[10,"Presentación y defensa académica","Sumativa",10]],"rubrics":[{"id":"R1","name":"Foro de discusión: expectativas, experiencias y primeras perspectivas sobre IA en educación","sem":1,"peso":5,"producto":"Publicación inicial de 400 a 500 palabras que responde seis preguntas y dos respuestas sustantivas a compañeros, con al menos una pregunta que profundice la discusión.","crit":[["Experiencia y comprensión de la IA en educación (preguntas 1 y 2)",20,"Describe experiencias concretas y define la IA en educación con precisión, distinguiendo capacidades reales de expectativas.","Describe experiencias y ofrece una definición correcta, con poca distinción entre capacidades y expectativas.","Experiencias o definición vagas; mezcla conceptos como IA, automatización y software.","No responde, o la definición es incorrecta."],["Oportunidades y riesgos en su contexto (preguntas 3 y 4)",25,"Identifica oportunidades y riesgos propios de su contexto, con ejemplos verificables y al menos una fuente.","Identifica oportunidades y riesgos pertinentes, con ejemplos generales y sin fuente.","Enumera oportunidades o riesgos genéricos, sin ejemplo ni vínculo con su contexto.","Omite uno de los dos o repite lugares comunes sin análisis."],["Equilibrio entre tecnología, responsabilidad humana, inclusión y sustentabilidad (pregunta 5)",20,"Toma una posición argumentada sobre cómo equilibrar los cuatro elementos y nombra una decisión que debe seguir siendo humana.","Aborda los cuatro elementos con una posición clara pero poco argumentada.","Aborda uno o dos elementos; la posición queda implícita.","No aborda el equilibrio."],["Expectativas y preguntas de indagación (pregunta 6)",10,"Formula expectativas específicas y al menos una pregunta de indagación investigable, ligada a su contexto.","Formula expectativas claras; la pregunta de indagación es general.","Expectativas amplias (\"aprender más sobre IA\"), sin pregunta.","No responde."],["Interacción con pares",15,"1 posición inicial + 2 réplicas sustantivas a compañeros, dentro del plazo, con al menos una pregunta que profundiza.","1 posición + 2 réplicas pertinentes dentro del plazo, sin pregunta que profundice; o 1 réplica sustantiva.","Solo 1 posición, sin réplicas, o réplicas de simple acuerdo.","No participa en el periodo establecido."],["Comunicación académica (400 a 500 palabras)",10,"Respeta la extensión, estructura clara, redacción precisa y fuentes en APA 7 cuando afirma datos.","Extensión y estructura adecuadas, con errores menores de redacción o cita.","Fuera de la extensión o con estructura difusa; afirma datos sin citar.","Texto ilegible, copiado o muy fuera de la extensión."]]},{"id":"R2","name":"Diagnóstico de una necesidad educativa y oportunidad de aplicación de IA","sem":2,"peso":10,"producto":"Diagnóstico breve con ocho apartados: contexto, problema, datos, posible aplicación de IA, valor esperado, limitaciones y riesgos, supervisión humana y pregunta orientadora.","crit":[["Contexto educativo y población",10,"Describe institución, población y situación observada con precisión suficiente para que un tercero la comprenda.","Describe los tres elementos; faltan detalles de población o de situación.","Descripción general, sin población definida.","No hay contexto, o es irreconocible."],["Problema o necesidad y evidencia que lo verifica",20,"Formula un problema delimitado (qué ocurre, a quiénes afecta, por qué importa) y nombra evidencia que permitiría verificarlo.","Problema claro; la evidencia se menciona pero no se concreta.","Problema amplio o formulado como solución (\"necesito un chatbot\"); sin evidencia.","No hay un problema identificable."],["Datos disponibles o necesarios",15,"Identifica datos disponibles y necesarios (académicos, LMS, asistencia, evaluaciones, encuestas) y valora si podrá acceder a ellos.","Identifica datos pertinentes sin valorar su acceso o calidad.","Menciona datos genéricos sin vínculo con el problema.","No identifica datos."],["Posible aplicación de IA y valor educativo esperado",15,"Relaciona el problema con un tipo de aplicación (predicción, clasificación, alerta temprana, personalización, etc.) y argumenta el valor esperado sin asumir que la IA es la mejor respuesta.","Relaciona el problema con una aplicación y un valor, con argumentación parcial.","Propone IA como solución sin justificarla.","No propone aplicación ni valor."],["Limitaciones y riesgos iniciales",15,"Analiza datos insuficientes, sesgo, privacidad, inequidad, interpretación incorrecta y automatización excesiva, con ejemplos del caso.","Identifica varios riesgos pertinentes con análisis breve.","Enumera riesgos sin analizarlos.","No considera riesgos."],["Rol de la supervisión humana",10,"Distingue qué decisiones deben seguir en manos de docentes o líderes y explica por qué.","Indica decisiones humanas sin justificarlas por completo.","Menciona \"supervisión humana\" sin decisiones concretas.","No la aborda."],["Pregunta orientadora",10,"Pregunta clara, investigable y coherente con el problema; puede guiar el resto del curso.","Pregunta clara pero algo amplia.","Pregunta vaga o que apunta a una herramienta.","No hay pregunta."],["Comunicación académica y fuentes",5,"Redacción precisa, estructura clara y referencias APA 7 verificables.","Redacción clara; errores menores de cita o formato.","Redacción confusa o referencias incompletas.","Errores que impiden la lectura, o texto que afirma datos sin referencias."]]},{"id":"R3","name":"Evaluación comparativa de alternativas de IA y decisión pedagógica basada en evidencia","sem":4,"peso":15,"producto":"Matriz de 11 criterios aplicada a tres alternativas de IA, con análisis final de siete puntos que incluye controles de supervisión humana y condiciones en que no se recomendaría implementar.","crit":[["Selección y comparabilidad de las tres alternativas",10,"Tres alternativas distintas que atienden el mismo problema del curso, descritas con suficiente detalle para compararlas.","Tres alternativas pertinentes; una se describe poco o se solapa con otra.","Alternativas que no atienden el mismo problema, o variantes de un mismo producto.","Menos de tres alternativas, o desconectadas del problema."],["Aplicación de la matriz de 11 criterios",25,"Valora las tres alternativas en los 11 criterios, con justificación breve y fuente en cada valoración relevante.","Completa los 11 criterios; la mayoría con justificación o fuente.","Completa la matriz con adjetivos sin justificación, u omite criterios.","Matriz incompleta o ausente."],["Evidencia de efectividad y calidad de las fuentes",20,"Usa estudios o evaluaciones independientes, distingue la información del proveedor y declara cuando no hay evidencia.","Usa fuentes académicas o institucionales; depende en parte de información del proveedor.","La evidencia proviene sobre todo del proveedor o de fuentes no verificables.","Sin evidencia, o presenta datos no verificables como hechos."],["Fortalezas, limitaciones y riesgos de cada alternativa",15,"Identifica fortalezas, limitaciones y riesgos principales de cada alternativa con evidencia, incluidos sesgo, privacidad, confiabilidad y dependencia tecnológica.","Identifica fortalezas y riesgos de cada alternativa; el análisis es desigual entre ellas.","Descripciones generales, casi idénticas para todas las alternativas.","No analiza."],["Controles y supervisión humana",10,"Define controles y mecanismos de supervisión específicos para la alternativa elegida y quién los ejerce.","Define controles pertinentes, sin responsable o mecanismo concreto.","Menciona supervisión sin controles.","No lo aborda."],["Justificación de la elección y condiciones de rechazo",15,"Justifica la alternativa elegida desde el problema y la evidencia, e indica con claridad en qué condiciones no la recomendaría.","Justificación coherente; las condiciones de rechazo son generales.","La elección no se vincula con el análisis, o no hay condiciones de rechazo.","No hay elección justificada."],["Comunicación académica y fuentes",5,"Redacción precisa, estructura clara y referencias APA 7 verificables.","Redacción clara; errores menores de cita o formato.","Redacción confusa o referencias incompletas.","Errores que impiden la lectura, o texto que afirma datos sin referencias."]]},{"id":"R4","name":"Certificación profesional SUJIS en analítica de aprendizaje inteligente","sem":5,"peso":10,"producto":"Certificado SUJIS emitido al completar los módulos, actividades y requisitos de la certificación.","especial":"Se evalúa con el certificado emitido por SUJIS. El puntaje de la actividad se comunica en el anuncio de la semana 5."},{"id":"R5","name":"Evaluación de una solución de IA para personalización, accesibilidad o inclusión","sem":7,"peso":15,"producto":"Informe de once apartados: necesidad, población, funcionalidades, valor pedagógico, accesibilidad, inclusión, riesgos de sesgo o exclusión, efectos sobre la autonomía, rol docente y supervisión humana, viabilidad y sustentabilidad, y recomendación final de adopción, adaptación o rechazo.","crit":[["Necesidad, población y funcionalidades",10,"Describe la necesidad, la población beneficiaria y las funcionalidades principales con precisión y fuentes.","Describe los tres elementos con precisión parcial.","Descripción general, o tomada del proveedor sin contraste.","Omite alguno de los tres, o es irreconocible."],["Valor pedagógico y alineación con los estudiantes y el contexto",15,"Argumenta con evidencia el valor pedagógico esperado y su alineación con las características de los estudiantes y del contexto.","Argumenta el valor pedagógico; la alineación con el contexto es parcial.","Afirma beneficios sin evidencia ni vínculo con el contexto.","No evalúa el valor pedagógico."],["Nivel de accesibilidad",15,"Evalúa la accesibilidad con evidencia independiente (norma, auditoría o pruebas) e identifica barreras que persisten.","Evalúa la accesibilidad con apoyo en la documentación del proveedor y señala algunas barreras.","Declara que la solución es accesible sin respaldo.","No aborda la accesibilidad."],["Inclusión, sesgo y exclusión",20,"Analiza quién se beneficia y quién puede quedar excluido, con riesgos de sesgo y sobreautomatización argumentados y propuestas de mitigación.","Analiza inclusión y riesgos con ejemplos pertinentes; la mitigación es general.","Menciona sesgo o exclusión sin analizarlos.","No lo aborda."],["Autonomía del estudiante, rol docente y supervisión humana",15,"Analiza efectos sobre la autonomía del estudiante y define el rol docente y los puntos de supervisión humana.","Aborda autonomía y rol docente; la supervisión es general.","Aborda solo uno de los aspectos, sin análisis.","No lo aborda."],["Viabilidad y sustentabilidad institucional",10,"Evalúa recursos, capacidad institucional, costos y mantenimiento con datos o supuestos explícitos.","Evalúa la viabilidad con supuestos parcialmente explícitos.","Afirmaciones generales de viabilidad.","No la evalúa."],["Recomendación final: adoptar, adaptar o rechazar",10,"Recomienda con coherencia lógica respecto al análisis y establece condiciones explícitas.","Recomendación coherente; condiciones poco explícitas.","La recomendación no se sigue del análisis.","No hay const $ = s => document.querySelector(s);

const weekDone = n => CHECKS.every((_, i) => done[n + '-' + i]);

/* navegación */
function parseHash() {
  const h = (location.hash || '').replace('#', '');
  if (h === 'recursos') return { v: 'recursos' };
  const m = h.match(/^semana-(\d+)$/);
  if (m && +m[1] >= 1 && +m[1] <= 10) return { v: 'semana', n: +m[1] };
  return { v: 'inicio' };
}
function go(token) { if (location.hash === '#' + token) route(); else location.hash = token; }
window.addEventListener('hashchange', route);

function renderSteps(cur) {
  $('#steps').innerHTML = DATA.weeks.map(w => {
    const cls = [weekDone(w.n) ? 'done' : '', cur === w.n ? 'now' : '', w.activities.some(a => a.rid) ? 'eval' : ''].join(' ');
    return `<li class="${cls}"><button type="button" data-w="${w.n}" aria-label="Semana ${w.n}: ${esc(w.short)}"${cur === w.n ? ' aria-current="step"' : ''}><span class="dot">${weekDone(w.n) ? '✓' : w.n}</span><span>${esc(w.short)}</span></button></li>`;
  }).join('');
  $('#steps').querySelectorAll('button').forEach(b => b.addEventListener('click', () => go('semana-' + b.dataset.w)));
  const total = DATA.weeks.filter(w => weekDone(w.n)).length;
  $('#progress-label').textContent = cur ? `Semana ${cur} de 10 · Avance ${total}` : `Avance ${total} de 10`;
}

    <div class="tablewrap"><table><thead><tr><th class="num">Sem.</th><th>Actividad</th><th>Tipo</th><th class="num">Valor</th></tr></thead><tbody>${plan}<tr class="total"><td></td><td>Total</td><td></td><td class="num">100%</td></tr></tbody></table></div></section>

      <div class="tablewrap"><table><thead><tr><th>Puntaje acumulado</th><th>Calificación</th></tr></thead><tbody>${scale}</tbody></table></div></section>
    <section class="card" id="politicas"><div class="sec-title"><div class="eyebrow">Políticas del Syllabus</div><h2>Lo esencial</h2></div>
      <ul style="margin:0;padding-left:20px;display:grid;gap:8px"><li><b>Entregas.</b> Entrega en las fechas publicadas y participa en las actividades de cada semana.</li><li><b>Integridad.</b> Presenta trabajo original. El plagio, la fabricación y el uso no autorizado de IA pueden llevar a medidas disciplinarias.</li><li><b>IA.</b> Solo cuando el docente la autorice. Verifica la información, evalúala críticamente y declara su uso.</li><li><b>Citas.</b> Formato APA 7.ª edición cuando aplique.</li><li><b>Accesibilidad.</b> El curso aplica UDL. Si necesitas adaptaciones, escribe a la oficina de BIU lo antes posible.</li></ul></section>
  </div>
  <section class="card calc" id="calculadora"><div class="sec-title"><div class="eyebrow">Calculadora</div><h2>Tu nota hasta ahora</h2></div>

    <div class="result" aria-live="polite"><div><small>Puntos acumulados</small><b id="r-pts">0,0</b></div><div><small>Promedio de lo calificado</small><b id="r-avg">–</b></div><div><small>Nota provisional</small><b id="r-let">–</b></div><div><small>Para cerrar en A (94)</small><b id="r-need">–</b></div></div></section>

    ${DATA.rubrics.map(r => `<details class="rub" id="rub-${r.id}"><summary><span>${r.id} · ${esc(r.name)}</span><span class="badge">Semana ${r.sem} · ${r.peso}%</span></summary><div class="body"><p><b>Producto:</b> ${esc(r.producto)}</p>${rubricTable(r)}</div></details>`).join('')}</section>

    <p class="foot" style="margin-top:12px">Herramientas: <a href="https://orangedatamining.com/" target="_blank" rel="noopener">Orange Data Mining</a> · <a href="https://oncampus.biu.us/biblioteca" target="_blank" rel="noopener">Biblioteca BIU</a></p></section>`;
}

function bindCalc() {
  const inputs = [...document.querySelectorAll('.calc input[type="number"]')];
  if (!inputs.length) return;
  const f = (v, d = 1) => v.toLocaleString('es', { minimumFractionDigits: d, maximumFractionDigits: d });
  const upd = () => {
    let pts = 0, wDone = 0, wAll = 0;
    inputs.forEach(i => { const w = +i.dataset.w; wAll += w; const v = parseFloat(i.value); if (!isNaN(v) && v >= 0) { const c = Math.min(v, 100); pts += w * c / 100; wDone += w; } });
    $('#r-pts').textContent = f(pts);
    if (!wDone) { $('#r-avg').textContent = '–'; $('#r-let').textContent = '–'; $('#r-need').textContent = '–'; return; }
    const avg = pts / wDone * 100;
    $('#r-avg').textContent = f(avg) + '%';
    $('#r-let').textContent = letter(avg);
    const rest = wAll - wDone;
    if (!rest) { $('#r-need').textContent = pts >= 94 ? 'Logrado' : 'No alcanzable'; return; }
    const need = (94 - pts) / rest * 100;
    $('#r-need').textContent = need <= 0 ? 'Asegurado' : need > 100 ? 'No alcanzable' : f(need) + '%';
  };
  inputs.forEach(i => i.addEventListener('input', upd));
}

function route() {
  const r = parseHash();
  const v = $('#view');
  $('#nav-inicio').setAttribute('aria-current', r.v === 'inicio' ? 'page' : 'false');
  $('#nav-recursos').setAttribute('aria-current', r.v === 'recursos' ? 'page' : 'false');
  v.innerHTML = r.v === 'semana' ? viewSemana(r.n) : r.v === 'recursos' ? viewRecursos() : viewInicio();
  v.style.display = 'grid'; v.style.gap = '20px';
  renderSteps(r.v === 'semana' ? r.n : 0);
  v.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  v.querySelectorAll('.chain button').forEach(b => b.addEventListener('click', () => go('semana-' + b.dataset.w)));
  v.querySelectorAll('[data-rub]').forEach(b => b.addEventListener('click', () => { pendingRub = b.dataset.rub; go('recursos'); }));
  v.querySelectorAll('.check input').forEach(c => c.addEventListener('change', () => { done[c.dataset.k] = c.checked; save(); renderSteps(r.n); }));
  v.querySelectorAll('[data-anchor]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); const t = document.getElementById(a.dataset.anchor); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
  const mail = $('#copy-mail');
  if (mail) mail.addEventListener('click', () => { const t = 'aperez@professor.biu.us'; const ok = () => { mail.textContent = 'Copiado'; setTimeout(() => mail.textContent = 'Copiar', 1500); }; try { navigator.clipboard.writeText(t).then(ok, () => { const s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents($('#mail')); s.removeAllRanges(); s.addRange(rg); }); } catch (e) {} });
  if (r.v === 'recursos') { bindCalc(); }
  if (pendingRub) { const d = document.getElementById('rub-' + pendingRub); if (d) { d.open = true; d.scrollIntoView({ block: 'start' }); } pendingRub = null; }
  else window.scrollTo(0, 0);
}
let pendingRub = null;
$('#nav-inicio').addEventListener('click', () => go('inicio'));
$('#nav-recursos').addEventListener('click', () => go('recursos'));
$('#theme-btn').addEventListener('click', () => { const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark ? 'light' : 'dark'; });
route();
</script>
